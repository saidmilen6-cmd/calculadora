<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    
    <div class="resultado">
        <p id="resultado">
            0
        </p>
    </div>
    <div class="flex">
        <div class="flex teclas">
            <section>
                <div class="grid valores">
                    <button value=7 class="valor">7</button>
                    <button value=8 class="valor">8</button>
                    <button value=9 class="valor">9</button>
                    <button value=4 class="valor">4</button>
                    <button value=5 class="valor">5</button>
                    <button value=6 class="valor">6</button>
                    <button value=1 class="valor">1</button>
                    <button value=2 class="valor">2</button>
                    <button value=3 class="valor">3</button>
                    <button value=. class="valor" id="ponto">.</button>
                    <button value=0 class="valor">0</button>
                    <button id="igualdade">=</button>
                </div>
            </section>
            <div class="operadores grid">
                <button id="divisao" value="/">/</button>
                <button id="multiplicacao" value="x">X</button>
                <button id="subtracao" value="-">-</button>
                <button id="adicao" value="+">+</button>
            </div>
        </div>
    </div>
    <div class="outros">
        <button id="apagar">C</button>
        <button>🠔</button>
    </div>
</body>
</html>
